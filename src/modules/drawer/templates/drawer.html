<div id="crabs-drawer" class="drawer-closed">
  <div id="drawer-tab">
    {{TabIcon}}
  </div>
  <div class="drawer-content CRABS_wrapper">
    <div class="CRABS_wrapper_header" style="display: flex; align-items: center; padding: 8px 12px; min-height: 50px; justify-content: space-between;">
      <div class="header-left-icons" style="display: flex; gap: 4px; z-index: 2; flex-shrink: 0;">
        <div class="CRABS_Drawer_Help_Icon">{{Help}}</div>
        <div class="CRABS_Drawer_Settings_Icon">{{Settings}}</div>
        <div class="CRABS_Drawer_Layout_Icon" style="cursor: pointer; display: flex; align-items: center;">{{Layout}}</div>
        <div class="CRABS_Drawer_History_Icon" style="cursor: pointer; display: flex; align-items: center;" data-active="false">{{History}}</div>
      </div>
      <div id="drawer-title">
        {{TitleBar}}
      </div>
      <div class="header-right-icons" style="display: flex; align-items: center; gap: 8px; z-index: 2; flex-shrink: 0;">
        <div id="CRABS_sort_container" style="display: flex; align-items: center; gap: 4px; font-size: 1.2rem; font-weight: bold;">
          <div id="CRABS_Drawer_Sort_Icon_Container">
            {{SortIcon}}
          </div>
          <select id="CRABS_sort_dropdown" class="CRABS_dropdown">
            <option value="natural">{{t:roster.sort_options.natural}}</option>
            <option value="role">{{t:roster.sort_options.role}}</option>
            <option value="ds">{{t:roster.sort_options.ds}}</option>
            <option value="lovers">{{t:roster.sort_options.lovers}}</option>
            <option value="friends">{{t:roster.sort_options.friends}}</option>
            <option value="whitelist">{{t:roster.sort_options.whitelist}}</option>
            <option value="blacklist">{{t:roster.sort_options.blacklist}}</option>
          </select>
        </div>
        <div class="CRABS_Drawer_Close_Icon">{{Close}}</div>
      </div>
    </div>
    <div class="CRABS_wrapper_content" style="display: flex; flex-direction: column;">
      <div id="CRABS_Drawer_Roster">
      </div>
    </div>
  </div>
</div>
