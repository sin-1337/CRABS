<div class="CRABS_key_card" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; margin-bottom: 12px; background: rgba(0, 0, 0, 0.28); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);">
  <div style="display: flex; align-items: center; gap: 18px;">
    <div style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      {{KeyIcon}}
    </div>
    <span style="font-weight: bold; font-size: 17px; letter-spacing: 0.5px;">{{KeyLabel}}</span>
  </div>
  <button type="button" class="CRABS_btn CRABS_drop_key_btn" data-key="{{KeyType}}" style="padding: 8px 18px; font-size: 14px; cursor: pointer;">
    {{DropButtonLabel}}
  </button>
</div>
