<div class="CRABS_keys_view_container" style="padding: 16px 24px; max-width: 780px; width: 100%; margin: 0 auto; box-sizing: border-box;">
  <div class="CRABS_keys_list" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
    {{Cards}}
  </div>
  <div style="display: {{DropAllDisplay}}; justify-content: flex-end; padding-right: 14px; margin-top: 16px; box-sizing: border-box;">
    <button type="button" class="CRABS_btn CRABS_drop_key_btn CRABS_drop_all_btn" data-key="all">
      {{t:keys.drop_all}}
    </button>
  </div>
</div>
