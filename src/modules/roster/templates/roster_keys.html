<div class="CRABS_keys_view_container" style="padding: 16px 24px; max-width: 780px; width: 100%; margin: 0 auto; box-sizing: border-box;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <span style="font-size: 15px; color: #ccc; font-weight: 500;">{{Prompt}}</span>
    <button type="button" class="CRABS_btn CRABS_keys_back_btn" style="padding: 6px 16px; font-size: 14px; cursor: pointer;">
      {{t:keys.back_to_roster}}
    </button>
  </div>
  <div class="CRABS_keys_list">
    {{Cards}}
  </div>
  <div style="text-align: right; margin-top: 14px; display: {{DropAllDisplay}};">
    <button type="button" class="CRABS_btn CRABS_drop_key_btn" data-key="all" style="padding: 8px 22px; font-size: 14px; cursor: pointer;">
      {{t:keys.drop_all}}
    </button>
  </div>
</div>
