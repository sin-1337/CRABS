<div class="CRABS_keys_view_container" style="padding: 16px 24px; max-width: 780px; width: 100%; margin: 0 auto; box-sizing: border-box;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding-right: 20px; margin-bottom: 16px; box-sizing: border-box;">
    <span style="font-size: 15px; color: #ccc; font-weight: 500;">{{Prompt}}</span>
    <button type="button" class="CRABS_btn CRABS_keys_back_btn" style="width: 170px; height: 38px; font-size: 14px; text-align: center; justify-content: center; flex-shrink: 0; cursor: pointer; box-sizing: border-box;">
      {{t:keys.back_to_roster}}
    </button>
  </div>
  <div class="CRABS_keys_list">
    {{Cards}}
  </div>
  <div style="display: {{DropAllDisplay}}; justify-content: flex-end; padding-right: 20px; margin-top: 14px; box-sizing: border-box;">
    <button type="button" class="CRABS_btn CRABS_drop_key_btn" data-key="all" style="width: 170px; height: 38px; font-size: 14px; text-align: center; justify-content: center; flex-shrink: 0; cursor: pointer; box-sizing: border-box;">
      {{t:keys.drop_all}}
    </button>
  </div>
</div>
