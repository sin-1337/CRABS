<div class="CRABS_room-status">
  <!-- Meta Table -->
  <div class="CRABS_table-wrapper">
    <table class="CRABS_room-meta">
      <thead>
        <tr>
          <th>Room Admins</th>
          <th>Room Guests</th>
          <th>Friends</th>
          <th>Club Members</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{adminsInRoom}} / {{totalAdmins}}</td>
          <td>{{playersInRoom}} / {{totalPlayers}}</td>
          <td>{{friendsOnline}} / {{totalFriends}}</td>
          <td>{{onlinePlayers}}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Header -->
  <h3 class="CRABS_players-header">Players in Room</h3>

  <!-- Container for dynamic user tables -->
  <div class="CRABS_user-tables-container" id="CRABS_userTablesContainer">
    <!-- Left Table -->
    <div class="CRABS_user-table CRABS_left" id="CRABS_leftUserTableContainer">
      <table class="CRABS_room-users">
        <thead>
          <tr>
            <th>Badge</th>
            <th>Name</th>
            <th>Icons</th>
          </tr>
        </thead>
        <tbody id="CRABS_leftUserBody">
          {{leftUserRows}}
        </tbody>
      </table>
    </div>

    <!-- Right Table (conditionally shown) -->
    <div class="CRABS_user-table CRABS_right" id="CRABS_rightUserTableContainer" style="display: none;">
      <table class="CRABS_room-users">
        <thead>
          <tr>
            <th>Badge</th>
            <th>Name</th>
            <th>Icons</th>
          </tr>
        </thead>
        <tbody id="CRABS_rightUserBody">
          {{rightUserRows}}
        </tbody>
      </table>
    </div>
  </div>
</div>
