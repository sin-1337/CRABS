<table class="CRABS_card">
    <tbody>
        <tr>
            <td rowspan="2">
                <a style="cursor:pointer;" onclick="PlayerFocus({{PlayerNumber}})">{{Badge}}</a>
            </td>
            <td>
                <span style="color:{{LabelColor}}; cursor:pointer; font-family: Arial, sans-serif; text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.7); white-space: nowrap;" onclick="sendWhisper({{PlayerNumber}})" onmouseover="this.style.textDecoration='underline';" onmouseout="this.style.textDecoration='none';">{{PlayerName}}({{PlayerNumber}})</span>
            </td>
        </tr>
        <tr>
            <td height=1em>{{PlayerIcons}}</td>
        </tr>
    </tbody>
</table>
