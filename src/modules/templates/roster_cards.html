<div class="CRABS_card" style="--border-color: {{LabelColorBorder}}">
  <div class="CRABS_card_badge">
    <a class="CRABS_player-badge" data-player-number="{{PlayerNumber}}">
      {{Badge}}
    </a>
  </div>
  <div class="CRABS_card_info">
    <div class="CRABS_overflow-wrapper">
      <div class="CRABS_player-id" style="color:{{LabelColor}};" data-player-number="{{PlayerNumber}}">
        <span class="CRABS_overflow-scroll">{{PlayerName}}({{PlayerNumber}})</span>
      </div>
    </div>
    <div class="CRABS_card_details">
      <div class="CRABS_player-icons">{{PlayerIcons}}</div>
      <div class="CRABS_status-frame">{{StatusIcons}}</div>
    </div>
  </div>
</div>
