<div class="CRABS_card">
        <a style="cursor:pointer;" onclick="PlayerFocus({{PlayerNumber}})">{{Badge}}</a>
        <style="color:{{LabelColor}} || "#000000"}; cursor:pointer; font-family: Arial, sans-serif; text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.7); white-space: nowrap;" onclick="sendWhisper({{PlayerNumber}})" onmouseover="this.style.textDecoration='underline';" onmouseout="this.style.textDecoration='none';">{{PlayerName}}[{{PlayerNumber}}]</style>
        <span style="display: block; text-align: right"><br>{{PlayerIcons}} </span>
</div>
