<div class="CRABS_wrapper">
<table class="CRABS_banner">
    <tbody>
        <tr>
            <td>{{Logo}}</td>
            <td>{{Name}}</td>
            <td>{{Version}}</td>
        </tr>
        <tr>
            <td colspan=3 style="color: {{LabelColor}}">{{PlayerPermission}}</td>
        </tr>
        <tr>
            <td colspan=3 style="text-align: left">Room: {{RoomName}}</td>
        </tr>
        <tr>
            <td colspan=3>
                {{RosterCounters}}
            </td>
        </tr>
        <tr>
            <td colspan=3>
                Use /roster to see the full output
            </td>
        </tr>
    </tbody>
</table>
</div>
