<table class="CRABS_banner">
    <tbody>
        <tr>
            <td class="CRABS_banner_logo_container">{{Logo}}</td>
            <td>{{Name}}</td>
            <td class="CRABS_banner_version_container">{{Version}}</td>
            <td style="vertical-align: top; text-align: right;"><a data-action"close-button">{{CloseButton}}</a> </td>
        </tr>
        <tr>
            <td colspan=4><br>Item Permission:</td>
        </tr>
        <tr>
            <td colspan=4 style="text-shadow: 1px 1px 2px white; color: {{LabelColor}}">{{PlayerPermission}}</td>
        </tr>
        <tr>
            <td colspan=4>Room: {{RoomName}}</td>
        </tr>
        <tr>
            <td colspan=4>{{RosterCounters}}<hr></td>
        </tr>
        <tr>
            <td colspan=4>Use <a class="CRABS_banner_rosterlink" data-action="print-roster">/roster</a> to see the full output</td>
        </tr>
    </tbody>
</table>
