name: Deploy and Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Field to increment (major, minor, patch, build) or specific version (1.2.3.4)"
        required: true
        default: "build"
  push:
    branches:
      - "Alpha"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show dependency versions
        run: |
          echo "Dependency versions:"
          npm outdated || true
          echo "----------------"

      - name: Process Version and Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          CURRENT_VERSION="1.3.2.9"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "Current Version: $CURRENT_VERSION"
          echo "Current Branch: $BRANCH"

          # Update config files for current branch
          sed -i "s|file:.*|file: \"../Live/CRABS/$BRANCH/bundle.js\",|" rollup.config.mjs
          sed -i "s|\"main\": .*|\"main\": \"$BRANCH/bundle.js\",|" package.json

          # Commit and push changes to current branch first
          git add .
          git commit -m "build #$CURRENT_VERSION perform deploy"
          git push origin $BRANCH

          # Handle Version Bumping
          ARGUMENT="${{ github.event.inputs.version_type }}"

          if [[ "$ARGUMENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r major minor patch build <<< "$ARGUMENT"
            field="NULL"
          else
            IFS='.' read -r major minor patch build <<< "$CURRENT_VERSION"
            field=""
          fi

          increment_version() {
            case $1 in
              major) ((major++)); minor=0; patch=0; build=0 ;;
              minor) ((minor++)); patch=0; build=0 ;;
              patch) ((patch++)); build=0 ;;
              build) ((build++)) ;;
              NULL) ;;
              *) echo "Invalid field"; exit 1 ;;
            esac
          }

          if [ -z "$field" ]; then
            increment_version "build"
          else
            increment_version "$field"
          fi

          NEW_VERSION="$major.$minor.$patch.$build"
          echo "New Version: $NEW_VERSION"

          # Update version using safer regex to avoid injecting syntax errors
          sed -i "s/VERSION: JSON.stringify(\"[^\"]*\")/VERSION: JSON.stringify(\"$NEW_VERSION\")/" rollup.config.mjs
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          sed -i "s/\/\/ @version .*/\/\/ @version $NEW_VERSION/" crabsloader.user.js

          # Build the project
          npx rollup -c

          # Commit the version bump
          git add .
          git commit -m "Update version number to $NEW_VERSION"

          # Move to main branch to push the 'Live' state
          git fetch origin main
          git checkout main

          # Merge changes or add files if they were generated/modified
          git add .
          git commit -m "build #$NEW_VERSION" || echo "No changes to commit"
          git push origin main

          # Create GitHub Release
          gh release create "v$NEW_VERSION" --title "Release $NEW_VERSION" --notes "Automated release from GitHub Actions"

          echo "The new version is: $NEW_VERSION"
