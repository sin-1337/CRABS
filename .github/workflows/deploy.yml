name: Deploy and Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Field to increment (major, minor, patch, build) or specific version (1.2.3.4)"
        required: true
        default: "build"
  push:
    branches:
      - "Alpha"
      - "Beta"
      - "Stable"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show dependency versions
        run: |
          echo "Dependency versions:"
          npm outdated || true
          echo "----------------"

      - name: Process Version and Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Read current version dynamically from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BRANCH=${GITHUB_REF_NAME}

          echo "Current Version: $CURRENT_VERSION"
          echo "Current Branch: $BRANCH"

          # Update config files to output inside the repo structure
          sed -i "s|file:.*|file: \"Live/CRABS/$BRANCH/bundle.js\",|" rollup.config.mjs
          sed -i "s|\"main\": .*|\"main\": \"Live/CRABS/$BRANCH/bundle.js\",|" package.json

          # Handle Version Bumping
          ARGUMENT="${{ github.event.inputs.version_type }}"

          if [[ "$ARGUMENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r major minor patch build <<< "$ARGUMENT"
            field="NULL"
          else
            IFS='.' read -r major minor patch build <<< "$CURRENT_VERSION"
            field=""
          fi

          increment_version() {
            case $1 in
              major) ((major++)); minor=0; patch=0; build=0 ;;
              minor) ((minor++)); patch=0; build=0 ;;
              patch) ((patch++)); build=0 ;;
              build) ((build++)) ;;
              NULL) ;;
              *) echo "Invalid field"; exit 1 ;;
            esac
          }

          if [ -z "$field" ]; then
            increment_version "build"
          else
            increment_version "$field"
          fi

          NEW_VERSION="$major.$minor.$patch.$build"
          echo "New Version: $NEW_VERSION"

          # Update version using safer regex to prevent syntax errors
          sed -i "s/VERSION: JSON.stringify(\"[^\"]*\")/VERSION: JSON.stringify(\"$NEW_VERSION\")/" rollup.config.mjs
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          sed -i "s/\/\/ @version .*/\/\/ @version $NEW_VERSION/" crabsloader.user.js

          # Build the project
          npx rollup -c

          # Commit everything (version bumps and built artifacts)
          git add .
          git commit -m "build #$NEW_VERSION perform deploy" || echo "No changes to commit"

          # Push directly back to the branch that triggered the action
          git push origin $BRANCH

          # Create GitHub Release
          gh release create "v$NEW_VERSION" --title "Release $NEW_VERSION" --notes "Automated release from GitHub Actions ($BRANCH branch)"

          echo "The new version is: $NEW_VERSION deployed to $BRANCH"
